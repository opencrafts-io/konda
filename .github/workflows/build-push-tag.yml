name: Build, Push, and Update konda Backend

on:
  push:
    branches:
      - main
      - staging

jobs:
  build-push-update:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout konda Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Docker Tags
        id: tags
        run: |
          BRANCH=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          SHA=$(git rev-parse --short HEAD)

          if [ "$BRANCH" = "main" ]; then
            IMAGE_TAG="prod"
            IMAGE_BASE="${{ secrets.DOCKERHUB_USERNAME }}/konda-frontend-prod"
          else
            IMAGE_TAG="dev"
            IMAGE_BASE="${{ secrets.DOCKERHUB_USERNAME }}/konda-frontend-staging"
          fi

          echo "image_base=$IMAGE_BASE" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push konda Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.image_tag }}
            ${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout InfraOps Repo
        uses: actions/checkout@v4
        with:
          repository: opencrafts-io/infraops
          token: ${{ secrets.GH_TOKEN }}
          ref: main
          path: infraops

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Compute deployment file path
        id: target
        run: |
          BRANCH="${GITHUB_REF_NAME#refs/heads/}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            FILE="infraops/services/konda/deployment.yaml"
          else
            FILE="infraops/qaservices/konda/deployment.yaml"
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Deployment file: $FILE"

      - name: Update deployment.yaml
        run: |
          FILE="${{ steps.target.outputs.file }}"
          IMAGE="${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.sha_tag }}"
          echo "Updating $FILE with image: $IMAGE"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE does not exist!"
            ls -la "$(dirname $FILE)"
            exit 1
          fi
          echo "Old image:"
          yq eval '.spec.template.spec.containers[0].image' "$FILE"
          yq eval ".spec.template.spec.containers[0].image = \"$IMAGE\"" -i "$FILE"
          echo "New image:"
          yq eval '.spec.template.spec.containers[0].image' "$FILE"

      - name: Commit and push changes
        run: |
          cd infraops
          IMAGE="${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.sha_tag }}"
          git config user.name "CI Bot from Github Actions"
          git config user.email "actions@github.com"
          
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            FILE="services/konda/deployment.yaml"
          else
            FILE="qaservices/konda/deployment.yaml"
          fi
          
          git add "$FILE"
          git commit -m "chore: update konda image to $IMAGE (${{ github.ref_name }})"
          git push origin main
